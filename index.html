<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Busca Ofertas</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111418">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#111418;--card:#1b2027;--tx:#e8ebef;--mut:#8f99a6;--ac:#5aa2ff;--ok:#3ccf82;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
input,select,button{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid #8884;background:var(--card);color:var(--tx);width:100%}
button{background:#2b6fe0;color:#fff;border:0;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;margin-bottom:8px}
.row>*{flex:1}.row>button.small{flex:0 0 auto;width:auto}
.mut{color:var(--mut);font-size:13px}
.price{color:var(--ok);font-weight:700;font-size:18px}
.msg{white-space:pre-wrap;word-break:break-word;margin:6px 0}
.grp{font-size:13px;color:var(--mut)}
a{color:var(--ac)}
.hidden{display:none}
label.g{display:flex;gap:8px;align-items:center;padding:6px 0}
label.g input{width:auto}
#err{color:#ff6b6b;font-size:14px;margin:6px 0}
</style>
</head>
<body>
<main>
<h1>🔎 Busca nos grupos de ofertas</h1>
<div id="err"></div>
<div id="st" class="mut" style="margin-bottom:8px"></div>
<section id="ask" class="card hidden">
  <p id="askLabel" style="margin:0 0 8px"></p>
  <input id="askInput" autocomplete="off" style="margin-bottom:8px">
  <button id="askOk">Continuar</button>
</section>

<section id="login" class="card hidden">
  <p class="mut">Cole os dados gerados em my.telegram.org. Ficam salvos só neste navegador.</p>
  <input id="apiId" inputmode="numeric" placeholder="api_id" style="margin-bottom:8px">
  <input id="apiHash" placeholder="api_hash" style="margin-bottom:8px">
  <button id="btnLogin">Entrar no Telegram</button>
</section>

<section id="app" class="hidden">
  <div class="card">
    <div class="row"><input id="q" placeholder="Ex.: air fryer" enterkeyhint="search"></div>
    <div class="row">
      <select id="ord"><option value="rec">Mais recentes</option><option value="menor">Menor preço</option></select>
      <select id="lim"><option value="10">10 por grupo</option><option value="25" selected>25 por grupo</option><option value="50">50 por grupo</option></select>
    </div>
    <button id="btnBuscar">Buscar</button>
  </div>
  <div id="res"></div>
  <details class="card">
    <summary>Grupos pesquisados</summary>
    <div id="grupos" class="mut">Carregando…</div>
    <div class="row" style="margin-top:8px">
      <button class="sec" id="btnRecarregar">Recarregar lista</button>
      <button class="sec" id="btnSair">Sair / apagar login</button>
    </div>
  </details>
</section>
</main>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
<script type="module">
import { Buffer } from "https://esm.sh/buffer@6.0.3";
globalThis.Buffer = Buffer;
globalThis.process = globalThis.process || { env:{}, versions:{}, browser:true, nextTick:(f,...a)=>setTimeout(()=>f(...a),0) };
let TelegramClient, StringSession;
try{
  // O esm.sh entrega um "crypto" de mentira; trocamos por hashes reais (síncronos)
  const stub = await import("https://esm.sh/node/crypto.mjs");
  const { sha1 } = await import("https://esm.sh/@noble/hashes@1.5.0/sha1");
  const { sha256, sha512 } = await import("https://esm.sh/@noble/hashes@1.5.0/sha2");
  const { pbkdf2 } = await import("https://esm.sh/@noble/hashes@1.5.0/pbkdf2");
  const algs = { sha1, sha256, sha512 };
  const norm = a => String(a||"sha1").toLowerCase().replace("-","");
  const toU8 = d => typeof d === "string" ? new TextEncoder().encode(d) : new Uint8Array(d.buffer ? d.buffer.slice(d.byteOffset, d.byteOffset + d.byteLength) : d);
  const P = stub.default;
  P.createHash = alg => {
    const f = algs[norm(alg)];
    if(!f) throw new Error("hash não suportado: "+alg);
    const h = f.create();
    return { update(d){ h.update(toU8(d)); return this; }, digest(enc){ const r = Buffer.from(h.digest()); return enc ? r.toString(enc) : r; } };
  };
  P.randomBytes = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return Buffer.from(a); };
  P.pbkdf2Sync = (pw, salt, iter, len, dig) => Buffer.from(pbkdf2(algs[norm(dig)], toU8(pw), toU8(salt), { c: iter, dkLen: len }));
  P.pbkdf2 = (pw, salt, iter, len, dig, cb) => { try{ cb(null, P.pbkdf2Sync(pw, salt, iter, len, dig)); }catch(e){ cb(e); } };

  const lib = await import("https://esm.sh/telegram@2.26.16?bundle");
  TelegramClient = lib.TelegramClient;
  StringSession = lib.sessions.StringSession;
}catch(e){
  document.getElementById("err").textContent = "Falha ao carregar a biblioteca: " + (e&&e.message?e.message:e);
}

const $ = id => document.getElementById(id);
const ls = {
  get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},
  del:k=>{try{localStorage.removeItem(k)}catch(e){}}
};
const err = m => $("err").textContent = m || "";
const st = m => $("st").textContent = m || "";
function ask(label, type){
  return new Promise(res=>{
    $("askLabel").textContent = label;
    const i = $("askInput"); i.value = ""; i.type = type || "text";
    $("ask").classList.remove("hidden"); i.focus();
    const done = ()=>{ const v=i.value.trim(); if(!v) return; $("ask").classList.add("hidden"); res(v); };
    $("askOk").onclick = done;
    i.onkeydown = e=>{ if(e.key==="Enter") done(); };
  });
}
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');

let client = null, dialogs = [];

async function connect(){
  const apiId = parseInt(ls.get("tg_id")), apiHash = ls.get("tg_hash");
  let saved = ls.get("tg_session")||"";
  try{ client = new TelegramClient(new StringSession(saved), apiId, apiHash, {connectionRetries:5}); }
  catch(e){ ls.del("tg_session"); client = new TelegramClient(new StringSession(""), apiId, apiHash, {connectionRetries:5}); }
  st("Conectando ao Telegram…");
  await Promise.race([
    client.connect(),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error("Tempo esgotado ao conectar. A rede pode estar bloqueando a conexão com o Telegram.")),25000))
  ]);
  st("Conectado. Verificando login…");
  await client.start({
    phoneNumber: ()=>ask("Seu número com DDI, ex.: +5519999999999","tel"),
    phoneCode: ()=>{ st("Código enviado. Veja no app do Telegram."); return ask("Código recebido no Telegram","tel"); },
    password: ()=>ask("Senha de verificação em duas etapas","password"),
    onError: e=>{ err("Erro no login: "+(e&&e.message?e.message:e)); }
  });
  st("");
  ls.set("tg_session", client.session.save());
}

async function carregarGrupos(){
  $("grupos").textContent = "Carregando…";
  const all = await client.getDialogs({limit:400});
  dialogs = all.filter(d=>d.isGroup||d.isChannel);
  const sel = new Set(JSON.parse(ls.get("tg_sel")||"[]"));
  const none = sel.size===0;
  $("grupos").innerHTML = dialogs.map(d=>{
    const id = String(d.id);
    return `<label class="g"><input type="checkbox" data-id="${id}" ${(none||sel.has(id))?"checked":""}> ${esc(d.title||"")}</label>`;
  }).join("") || "Nenhum grupo encontrado.";
  document.querySelectorAll("#grupos input").forEach(c=>c.onchange=salvarSel);
}
function salvarSel(){
  const ids=[...document.querySelectorAll("#grupos input:checked")].map(c=>c.dataset.id);
  ls.set("tg_sel", JSON.stringify(ids));
}
function selecionados(){
  const ids=new Set([...document.querySelectorAll("#grupos input:checked")].map(c=>c.dataset.id));
  return dialogs.filter(d=>ids.has(String(d.id)));
}
function preco(t){
  const m=[...t.matchAll(/R\$\s*([\d.]+(?:,\d{1,2})?)/g)].map(x=>parseFloat(x[1].replace(/\./g,"").replace(",",".")));
  const v=m.filter(n=>!isNaN(n)&&n>0);
  return v.length?Math.min(...v):null;
}
function linkMsg(d,m){
  const e=d.entity;
  return e.username?`https://t.me/${e.username}/${m.id}`:`https://t.me/c/${String(e.id)}/${m.id}`;
}

async function buscar(){
  err(""); const q=$("q").value.trim(); if(!q) return;
  const gs=selecionados(); if(!gs.length){err("Marque ao menos um grupo.");return}
  $("btnBuscar").disabled=true; $("res").innerHTML='<p class="mut">Buscando…</p>';
  const limit=parseInt($("lim").value); let out=[];
  await Promise.all(gs.map(async d=>{
    try{
      const ms=await client.getMessages(d.entity,{search:q,limit});
      for(const m of ms){ if(m.message) out.push({d,m,p:preco(m.message)}); }
    }catch(e){}
  }));
  if($("ord").value==="menor") out.sort((a,b)=>(a.p??1e12)-(b.p??1e12));
  else out.sort((a,b)=>b.m.date-a.m.date);
  $("res").innerHTML = out.length ? out.map(({d,m,p})=>`
    <div class="card">
      ${p!=null?`<div class="price">R$ ${p.toLocaleString("pt-BR",{minimumFractionDigits:2})}</div>`:""}
      <div class="msg">${linkify(m.message.slice(0,700))}</div>
      <div class="grp">${esc(d.title||"")} · ${new Date(m.date*1000).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})}</div>
      <a href="${linkMsg(d,m)}" target="_blank" rel="noopener">Abrir no Telegram</a>
    </div>`).join("") : '<p class="mut">Nada encontrado.</p>';
  $("btnBuscar").disabled=false;
}

async function iniciar(){
  try{
    await connect();
    $("login").classList.add("hidden"); $("app").classList.remove("hidden");
    await carregarGrupos();
  }catch(e){
    console.error(e); err("Não foi possível conectar: "+(e&&e.name?e.name+" - ":"")+(e&&e.message?e.message:String(e))); ls.del("tg_session");
    $("login").classList.remove("hidden");
  }
}

$("btnLogin").onclick=()=>{
  const id=$("apiId").value.trim(), h=$("apiHash").value.trim();
  if(!id||!h){err("Preencha api_id e api_hash.");return}
  ls.set("tg_id",id); ls.set("tg_hash",h); err(""); st("Iniciando…"); iniciar();
};
$("btnBuscar").onclick=buscar;
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")buscar()});
$("btnRecarregar").onclick=carregarGrupos;
$("btnSair").onclick=()=>{["tg_session","tg_id","tg_hash","tg_sel"].forEach(ls.del);location.reload()};

if(ls.get("tg_id")&&ls.get("tg_hash")) iniciar(); else $("login").classList.remove("hidden");
</script>
</body>
</html>
